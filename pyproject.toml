[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fed-vit-autorl"
version = "0.1.0"
description = "Federated learning of Vision Transformers with UCB1 AutoRL hyperparameter optimization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fed_vit_autorl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
